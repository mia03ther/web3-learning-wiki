<!-- Social share image (1200x630). Static palette on purpose: crawlers do not
     run the site CSS, so these colours must not depend on theme tokens. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630"
     role="img" aria-label="A Web3 Learning Wiki">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0e14"/>
      <stop offset="1" stop-color="#141b26"/>
    </linearGradient>
    <linearGradient id="sig" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <g opacity=".07" stroke="#8fa0b6" stroke-width="1">
    <path d="M0 105H1200M0 210H1200M0 315H1200M0 420H1200M0 525H1200"/>
    <path d="M100 0V630M300 0V630M500 0V630M700 0V630M900 0V630M1100 0V630"/>
  </g>

  <!-- mark -->
  <g transform="translate(96 118) scale(1.5)" fill="none" stroke="#22d3ee" stroke-linejoin="round">
    <path d="M32 6.5 12.5 17.5v29L32 57.5l19.5-11v-29L32 6.5Z" stroke-width="2.6" opacity=".55"/>
    <path d="M32 15.5 17.5 24v18L32 50.5 46.5 42V24L32 15.5Z" stroke-width="3.5"/>
    <circle cx="32" cy="33" r="5.4" fill="#22d3ee" stroke="none"/>
    <circle cx="32" cy="13.5" r="2.1" fill="#22d3ee" stroke="none" opacity=".8"/>
    <circle cx="15.6" cy="45.2" r="2.1" fill="#22d3ee" stroke="none" opacity=".8"/>
    <circle cx="48.4" cy="45.2" r="2.1" fill="#22d3ee" stroke="none" opacity=".8"/>
  </g>

  <text x="96" y="300" font-family="Inter, -apple-system, Segoe UI, sans-serif"
        font-size="30" font-weight="600" letter-spacing="6" fill="#8fa0b6">
    OPEN KNOWLEDGE BASE
  </text>

  <text x="96" y="386" font-family="Inter, -apple-system, Segoe UI, sans-serif"
        font-size="74" font-weight="800" letter-spacing="-2.6" fill="#eef4fa">
    A Web3 Learning Wiki
  </text>

  <text x="96" y="440" font-family="Inter, -apple-system, Segoe UI, sans-serif"
        font-size="26" font-weight="500" fill="#9fb0c4">
    区块链 · 智能合约 · AI Agent · 开发者工具 · 黑客松
  </text>

  <rect x="96" y="486" width="180" height="4" rx="2" fill="url(#sig)"/>

  <text x="96" y="546" font-family="JetBrains Mono, Consolas, monospace"
        font-size="22" letter-spacing="1" fill="#6f8098">
    mia03ther.github.io/web3-learning-wiki
  </text>
</svg>