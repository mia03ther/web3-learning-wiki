# MkDocs Material 配置文件
# 使用方法：
#   1. pip install mkdocs-material
#   2. mkdocs serve   （本地预览 http://127.0.0.1:8000）
#   3. mkdocs gh-deploy （一键部署到 GitHub Pages）
# 完整文档：https://squidfunk.github.io/mkdocs-material/

site_name: Web3 学习 Wiki
site_description: 从大一小白到港新 Web3 硕士的公开学习档案
site_author: （替换为你的名字）
repo_url: https://github.com/你的用户名/web3-learning-wiki
repo_name: web3-learning-wiki
edit_uri: edit/main/docs/

theme:
  name: material
  language: zh
  features:
    - navigation.tabs           # 顶部标签页
    - navigation.sections       # 侧边栏分组
    - navigation.expand         # 默认展开侧边栏
    - navigation.indexes        # 分组首页
    - navigation.top            # 回到顶部按钮
    - search.suggest            # 搜索建议
    - search.highlight          # 搜索高亮
    - content.code.copy         # 代码块复制按钮
    - content.tabs.link
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      accent: amber
      toggle:
        icon: material/brightness-7
        name: 切换到暗色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      accent: amber
      toggle:
        icon: material/brightness-4
        name: 切换到亮色模式
  font:
    text: Noto Sans SC
    code: JetBrains Mono

plugins:
  - search:
      lang:
        - en
        - ja

extra_javascript:
  - https://unpkg.com/mermaid/dist/mermaid.min.js
  - assets/javascripts/extra.js

markdown_extensions:
  - admonition                  # !!! note 提示框
  - pymdownx.details            # 可折叠提示框
  - pymdownx.superfences:       # 代码块/图表支持（含 Mermaid）
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.arithmatex:
      generic: true
  - attr_list
  - md_in_html
  - def_list
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

nav:
  - 首页: index.md
  - 从这里开始:
      - 00-start-here/index.md
  - 会议精读:
      - 01-meeting-notes/index.md
      - 路演夜：四个 AI×Web3 项目: 01-meeting-notes/01-pitch-night.md
      - Monad 黑客松与 Agent 金融: 01-meeting-notes/02-monad-hackathon.md
  - 小白词典:
      - 02-glossary/index.md
      - Web3 小白概念词典: 02-glossary/01-beginner-dictionary.md
      - 会议黑话对照表: 02-glossary/02-jargon-mapping.md
  - 四年路线图:
      - 03-roadmap/index.md
      - 四年总路线图: 03-roadmap/01-four-year-roadmap.md
      - 港新 Web3 硕士清单: 03-roadmap/02-hk-sg-masters.md
  - 技能与资源:
      - 04-skills/index.md
      - 技能树与免费资源: 04-skills/01-skill-tree-resources.md
      - 英语标化与背景提升: 04-skills/02-english-and-profile.md
  - 行动手册:
      - 05-playbooks/index.md
      - 黑客松参赛指南: 05-playbooks/01-hackathon-guide.md
      - GitHub 与个人 IP 搭建: 05-playbooks/02-github-and-personal-ip.md
      - Web3 实习求职指南: 05-playbooks/03-internship-job-guide.md
