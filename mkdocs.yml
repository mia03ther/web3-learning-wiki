# ============================================================
#  Web3 Learning Wiki — MkDocs Material configuration
#  Local:  python -m mkdocs serve   -> http://127.0.0.1:8000
#  Deploy: python -m mkdocs gh-deploy
#  Docs:   https://squidfunk.github.io/mkdocs-material/
# ============================================================

site_name: Web3 Learning Wiki
site_description: >-
  MIA_Ether 的个人开发者知识库 — 覆盖 Web3、AI Agents、区块链开发、
  开发者工具、黑客松与 builder 笔记的开源学习档案。
site_url: https://mia03ther.github.io/web3-learning-wiki/
site_author: MIA_Ether

repo_url: https://github.com/mia03ther/web3-learning-wiki
repo_name: mia03ther/web3-learning-wiki
edit_uri: edit/main/docs/

copyright: MIA_Ether · Licensed under CC BY-NC-SA 4.0

theme:
  name: material
  custom_dir: overrides
  language: zh
  logo: assets/brand.svg
  favicon: assets/favicon.svg
  features:
    - navigation.tabs             # 顶级标签栏
    - navigation.tabs.sticky      # 标签栏固定
    - navigation.sections         # 侧边栏分组
    - navigation.indexes          # 分组首页
    - navigation.top              # 回到顶部
    - navigation.footer           # 上一页 / 下一页
    - toc.follow                  # 右侧目录跟随
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: white
      accent: cyan
      toggle:
        icon: material/weather-night
        name: 切换到深色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: cyan
      toggle:
        icon: material/weather-sunny
        name: 切换到浅色模式
  font:
    text: Inter
    code: JetBrains Mono

extra:
  generator: false
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/mia03ther
    - icon: fontawesome/brands/x-twitter
      link: https://x.com/MIA03ther
    - icon: fontawesome/solid/envelope
      link: mailto:mia03ther@gmail.com
    - icon: fontawesome/solid/link
      link: https://mia03ther.github.io/

extra_css:
  - assets/stylesheets/extra.css

extra_javascript:
  - https://unpkg.com/mermaid/dist/mermaid.min.js
  - assets/javascripts/extra.js

plugins:
  - search:
      lang:
        - en
        - ja

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
  - pymdownx.inlinehilite
  - attr_list
  - md_in_html
  - def_list
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

nav:
  - Home: index.md
  - Start:
      - start/index.md
      - 如何使用本 Wiki: start/how-to-use.md
  - Fundamentals:
      - fundamentals/index.md
      - 核心概念词典: fundamentals/core-concepts.md
      - 黑话对照表: fundamentals/glossary.md
  - Field Notes:
      - field-notes/index.md
      - 路演夜 · 四个 AI × Web3 项目: field-notes/pitch-night.md
      - Monad 黑客松与 Agent 金融: field-notes/monad-hackathon.md
  - Handbook:
      - handbook/index.md
      - 黑客松参赛指南: handbook/hackathon.md
      - GitHub 与本站搭建: handbook/github-site.md
      - 实习与求职指南: handbook/internship.md
      - 面经题库: handbook/interview.md
      - 资料与手册: handbook/resources.md
  - Roadmap:
      - roadmap/index.md
      - 学习路线图: roadmap/learning-path.md
      - 精选课程中心: roadmap/courses.md
      - 技能树与资源: roadmap/skills-resources.md
      - 标化与背景建设: roadmap/profile.md
      - 海外深造参考: roadmap/graduate-study.md
  - About:
      - about/index.md
