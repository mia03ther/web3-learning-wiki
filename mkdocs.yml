site_name: Web3 Learning Wiki
site_description: >-
  MIA_Ether 的 Web3 × AI 学习笔记：区块链基础、智能合约、AI × Web3、安全与隐私、
  活动现场笔记与 Builder 成长路径。整理给群友，也欢迎每一个正在入门的人。
site_url: https://mia03ther.github.io/web3-learning-wiki/
site_author: MIA_Ether
repo_url: https://github.com/mia03ther/web3-learning-wiki
repo_name: mia03ther/web3-learning-wiki
edit_uri: edit/main/docs/
copyright: CC BY-NC-SA 4.0 · MIA_Ether

theme:
  name: material
  custom_dir: overrides
  language: zh
  # logo / favicon 都用 MIA 的头像（由 docs/assets/avatar/main.png 裁切生成）
  logo: assets/avatar/logo.jpg
  favicon: assets/avatar/favicon.png
  # 不从 Google Fonts 加载字体（国内经常卡住首屏），改用系统字体栈，见 extra.css
  font: false
  icon:
    alternate: material/translate
    admonition:
      note: octicons/tag-16
      abstract: octicons/checklist-16
      info: octicons/info-16
      tip: octicons/light-bulb-16
      success: octicons/check-circle-16
      question: octicons/question-16
      warning: octicons/alert-16
      failure: octicons/x-circle-16
      danger: octicons/zap-16
      bug: octicons/bug-16
      example: octicons/beaker-16
      quote: octicons/quote-16
  features:
    - announce.dismiss
    - navigation.indexes
    - navigation.path
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.action.edit
    - content.tabs.link
  # 浅色为主：默认浅色，右上角可切换深色（选择会被记住）
  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: 切换到深色模式
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: 切换到浅色模式

extra:
  generator: false
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/mia03ther/web3-learning-wiki
      name: GitHub
    - icon: fontawesome/regular/comments
      link: https://github.com/mia03ther/web3-learning-wiki/discussions
      name: GitHub Discussions

extra_css:
  - assets/stylesheets/extra.css
  - assets/stylesheets/home.css
  - assets/stylesheets/reading.css

extra_javascript:
  - assets/javascripts/extra.js

validation:
  omitted_files: info
  absolute_links: warn
  unrecognized_links: warn

plugins:
  - search:
      lang:
        - zh
        - en
  - i18n:
      docs_structure: folder
      fallback_to_default: true
      languages:
        - locale: zh
          name: 中文
          default: true
          build: true
          link: /
        - locale: en
          name: English
          build: true
          link: /en/
          nav_translations:
            首页: Home
            入门: Start
            如何使用本 Wiki: How to Use This Wiki
            路线图总览: Roadmap Overview
            学习路线图: Learning Path
            精选课程中心: Course Hub
            技能树与资源: Skills & Resources
            资源汇总: Resource Roundup
            知识库: Knowledge
            区块链基础: Blockchain Basics
            核心概念词典: Core Concepts
            智能合约: Smart Contracts
            链上数据: On-chain Data
            AI × Web3: AI × Web3
            MCP 与 AI Agents: MCP & AI Agents
            安全与隐私: Security & Privacy
            AI 辅助开发: AI-assisted Development
            开发者工具: Developer Tools
            现场笔记: Field Notes
            ETHShenzhen 2026: ETHShenzhen 2026
            Day 1 · 硬件钱包与 Vibecoding: Day 1 · Hardware Wallets & Vibecoding
            Day 1 · 黑客松现场展示: Day 1 · Hackathon Demos
            Day 2 · 安全、隐私与路线图: Day 2 · Security, Privacy & Roadmap
            Day 2 · AI 开发与 Agent 边界: Day 2 · AI Dev & Agent Boundaries
            AI × Web3 产业创新交流会: AI × Web3 Industry Meetup
            Monad 黑客松与 Agent 金融: Monad Hackathon & Agent Finance
            路演夜 · 四个 AI × Web3 项目: Pitch Night · Four AI × Web3 Projects
            成长: Grow
            黑客松参赛指南: Hackathon Guide
            实习与求职指南: Internships & Careers
            面经题库: Interview Bank
            GitHub 与本站搭建: GitHub & This Site
            海外深造参考: Graduate Study
            标化与背景建设: Profile Building
            关于: About
            版本发布: Releases
            贡献指南: Contributing
            支持这个 Wiki: Support This Wiki

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      # 中文标题也生成可读的锚点（默认会把中文全部丢掉，变成 _1、_2）
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.details
  - pymdownx.mark
  - pymdownx.keys
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
  - pymdownx.inlinehilite
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

