<!--
  Favicon (v3): the brand mark in white on the indigo accent tile, so it reads
  on both light and dark browser chrome.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64"
     role="img" aria-label="Web3 Learning Wiki">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6b6bf0"/>
      <stop offset="1" stop-color="#4a4ac8"/>
    </linearGradient>
  </defs>
  <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#tile)"/>
  <g fill="none" stroke="#ffffff" stroke-linecap="round" stroke-linejoin="round">
    <path d="M32 10 50 20.7V43.3L32 54 14 43.3V20.7L32 10Z" stroke-width="3.4" opacity=".95"/>
    <path d="M22 46 28.6 29l3 5.3 3-5.3 7.4 17" stroke-width="2.8"/>
  </g>
  <g fill="#ffffff">
    <circle cx="22" cy="46" r="3.2"/>
    <circle cx="28.6" cy="29" r="3.2"/>
    <circle cx="31.6" cy="34.3" r="3.4"/>
    <circle cx="34.6" cy="29" r="3.2"/>
    <circle cx="42" cy="46" r="3.2"/>
  </g>
</svg>
