<!--
  MIA03 Lab · Web3 Learning Wiki — brand mark
  A knowledge graph drawn inside a blockchain block:
  - hexagon ring = chain / block link
  - node path in the shape of "M" = MIA · data structure · neural network
  - corner dots = open-source network peers
  Uses currentColor only, so the mark inherits the active theme (light / dark)
  and stays legible in the navbar at any size.
-->
